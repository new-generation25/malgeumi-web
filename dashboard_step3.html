<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 기획 가이드 (PPT)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 50px;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            font-family: sans-serif;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 16px;
            margin: 0;
            color: #ccc;
        }

        .header a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            background: #444;
            padding: 5px 12px;
            border-radius: 4px;
        }

        .header a:hover {
            background: #666;
        }

        .viewer-container {
            flex: 1;
            width: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Fallback message */
        .fallback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            text-align: center;
            z-index: -1;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>📑 3단계: AI 제안서 작성 가이드 (PPT)</h1>
        <div>
            <a href="https://github.com/new-generation25/test-page/raw/main/ppt/ai-proposal-guide.pptx" download>💾 PPT
                다운로드</a>
            <a href="./index.html" style="margin-left: 10px;">🏠 홈으로</a>
        </div>
    </div>

    <div class="viewer-container">
        <!-- Using Microsoft Office Online Viewer -->
        <iframe
            src="https://view.officeapps.live.com/op/embed.aspx?src=https://github.com/new-generation25/test-page/raw/main/ppt/ai-proposal-guide.pptx"
            frameborder="0">
        </iframe>

        <div class="fallback">
            <p>문서를 불러오는 중입니다...</p>
            <p style="font-size: 0.8em;">(로딩이 오래 걸리면 위 다운로드 버튼을 이용하세요)</p>
        </div>
    </div>
</body>

</html>
